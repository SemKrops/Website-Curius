# Bouwt de website en zet hem op GitHub Pages: bij elke wijziging in de code, en elk
# uur, zodat nieuwe activiteiten en aanpassingen in Genkgo vanzelf op de site komen.
name: Website

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # De pagina's van de vorige keer. Is curius.nl even onbereikbaar, dan bouwt de
      # site met deze versie in plaats van te mislukken.
      - uses: actions/cache@v5
        with:
          path: .cache/bron
          key: bron-${{ github.run_id }}
          restore-keys: bron-

      - id: pages
        uses: actions/configure-pages@v6

      - name: Site bouwen
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Leeg betekent www.curius.nl. Zie LEESMIJ.md voor het overstappen naar het eigen domein.
          BRON_URL: ${{ vars.BRON_URL }}
          LEDEN_URL: ${{ vars.LEDEN_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
